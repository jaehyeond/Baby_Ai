[project]
name = "our-a2a-project"
version = "0.1.0"
description = "Claude 기반 A2A 멀티에이전트 시스템"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    # A2A SDK 코어 + 서버 의존성 분리 설치
    "a2a-sdk>=0.3.0",
    "starlette>=0.40.0",
    "sse-starlette>=2.0.0",
    # Claude API
    "anthropic>=0.40.0",
    # 서버/유틸리티
    "uvicorn>=0.34.0",
    "click>=8.1.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.10.0",
    # Supabase (Baby Brain DB - 마이그레이션 완료 후 제거 예정)
    "supabase>=2.0.0",
    # OpenAI (Embeddings)
    "openai>=1.0.0",
    # Google Gemini (official, actively maintained SDK)
    "google-genai>=1.10.0",
    # Neo4j AuraDB (DB Migration - Phase 0 완료)
    "neo4j>=5.0.0",
    # Upstash Redis (Pub/Sub + Cache - Phase 0 완료)
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]
ml-bench = [
    "huggingface-hub>=0.25.0",
    "psutil>=5.9.0",
    "Pillow>=10.0.0",
    "tabulate>=0.9.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agents", "hosts", "common"]
